[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tableau-desktop-mcp"
version = "0.1.0"
description = "Local MCP server to inspect and safely edit Tableau Desktop .twb workbooks (native Tableau calculated fields)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tableau-desktop-mcp" }]
dependencies = [
    "mcp>=1.2.0",
    "lxml>=5.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "lxml-stubs>=0.5.1",
]

[project.scripts]
tableau-desktop-mcp = "tableau_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]  # allow custom exception names without "Error" suffix

[tool.ruff.lint.per-file-ignores]
# Test data (embedded .twb XML) and assertion strings are allowed to be long.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
packages = ["tableau_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
